name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# An explicit bash runs steps with -eo pipefail, so a failing bundle in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The runner's own shellcheck moves with the image; this one is fixed by version and checksum.
      - name: Install shellcheck
        run: |
          tarball=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -sSLf -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh tests/run.sh

      # The libraries and mode tails are concatenated before they reach a host; check each stream as a whole.
      - name: Bundles parse
        run: |
          for mode in audit ensure fix autoupdate; do
            bash scripts/run.sh bundle "$mode" | bash -n
            echo "$mode: ok"
          done

      - name: Tests
        run: bash tests/run.sh
